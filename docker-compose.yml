# Local development database. Not for production: the credentials are throwaway and the port is
# bound to localhost only. Start with `npm run infra:up`.
name: nexera-erp

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexera}
      POSTGRES_DB: ${POSTGRES_DB:-nexera}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
