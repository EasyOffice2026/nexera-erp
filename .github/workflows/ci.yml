name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The API tests run against a real PostgreSQL, the same major version as docker-compose.yml.
    # They create and migrate their own schema (nexera_test) inside this database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nexera
          POSTGRES_PASSWORD: nexera
          POSTGRES_DB: nexera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexera -d nexera"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nexera:nexera@localhost:5432/nexera
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    name: Build the image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nexera-erp .
