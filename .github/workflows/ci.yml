name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nexera
          POSTGRES_PASSWORD: nexera
          POSTGRES_DB: nexera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexera -d nexera_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nexera:nexera@127.0.0.1:5432/nexera_test
      NEXERA_TEST_DATABASE_URL: postgresql://nexera:nexera@127.0.0.1:5432/nexera_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run check
